name: flutter_timer
description: FitTimer — interval training timer
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.8.0
  cupertino_icons: ^1.0.9
dependency_overrides:
  audioplayers_darwin: 6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  image: ^4.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    # Phosphor icons (MIT), see assets/fonts/LICENSE-Phosphor.txt
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#F2F2F7"
  color_dark: "#000000"
  android: true
  ios: true
